services:
  # Python Web Service — FastAPI Backend (also serves static frontend)
  - type: web
    name: scholoryou-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # python -m uvicorn avoids "command not found" (status 127)
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_ORIGIN
        value: "*"

  # React Static Site — Frontend SPA
  - type: web
    name: scholoryou-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
